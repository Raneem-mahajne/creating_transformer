name: stat_shared_letters
vocabulary_type: shared_letters
words: ["cat", "hat", "map"]
data:
  num_sequences: 2000
  min_length: 40
  max_length: 120
model:
  n_embd: 16
  block_size: 16
  num_heads: 4
  head_size: 4
  n_layer: 2
  use_layernorm: true
  use_residual: true
training:
  max_steps: 10000
  batch_size: 8
  learning_rate: 0.001
  eval_interval: 200
  eval_iterations: 50
  checkpoint_interval: 100
